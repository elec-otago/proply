<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>proply-rs — propeller design in the browser</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0 auto;
      max-width: 60rem;
      padding: 1rem;
    }
    h1 { font-size: 1.3rem; }
    #status {
      font-family: ui-monospace, monospace;
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      background: rgba(127, 127, 127, 0.15);
      margin: 0.6rem 0;
      min-height: 1.2em;
    }
    .row { display: flex; gap: 1rem; align-items: center; margin: 0.6rem 0; flex-wrap: wrap; }
    textarea {
      width: 100%;
      height: 22rem;
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
      box-sizing: border-box;
    }
    pre {
      overflow: auto;
      max-height: 30rem;
      padding: 0.5rem;
      border-radius: 4px;
      background: rgba(127, 127, 127, 0.15);
      font-size: 0.8rem;
    }
    button { padding: 0.4rem 1rem; font-size: 1rem; }
    button:disabled { opacity: 0.5; }
    label { user-select: none; }
  </style>
</head>
<body>
  <h1>proply-rs — propeller design in the browser</h1>
  <p>
    Blade element momentum theory + XFOIL polars (rust-foil) + the STEP
    writer, compiled to WebAssembly and running locally in this tab.
    Nothing is uploaded anywhere.
  </p>
  <div id="status">loading…</div>

  <div class="row">
    <button id="design" disabled>Design</button>
    <label><input type="checkbox" id="plate" checked> plate polars (fast —
    uncheck to compute real XFOIL polars in-wasm)</label>
    <button id="clear-cache">Clear polar cache</button>
  </div>

  <h2>Design parameters (JSON)</h2>
  <textarea id="params" spellcheck="false"></textarea>

  <h2>Design summary (YAML)</h2>
  <pre id="yaml"></pre>

  <h2>Propeller (STEP)</h2>
  <p id="step-link"></p>

  <script>
    // ES modules and the WebAssembly fetch cannot load over file:// — the
    // browser blocks them with a CORS error.  Serve the directory over http
    // instead and load the module only then.
    if (location.protocol === 'file:') {
      document.getElementById('status').textContent =
        'This page needs http:// (a browser blocks ES modules and .wasm ' +
        'over file://).  Serve it with:  python3 -m http.server -d proply-rs/web 8000  ' +
        'then open http://localhost:8000/';
      document.getElementById('design').disabled = true;
    } else {
      const s = document.createElement('script');
      s.type = 'module';
      s.src = './main.js';
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
