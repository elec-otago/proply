[package]
name = "proply-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Rust port of proply: propeller design using blade element momentum theory and rust-foil aerodynamics"
readme = "README.md"

[dependencies]
rust-foil = { path = "../rust-foil" }
step-io = "0.2"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "proply_rs"
path = "src/lib.rs"

[[bin]]
name = "proply-rs"
path = "src/main.rs"
